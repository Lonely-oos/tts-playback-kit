name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  roundtrip:
    name: ${{ matrix.os }} / py ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # 不需要安装任何依赖：假引擎是纯标准库生成的 wav
      - name: 版本
        run: python -V

      - name: 端到端测试（假引擎，不需要模型）
        run: python tests/test_roundtrip.py

      - name: PowerShell 语法检查（仅 Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path 'player/player.ps1'), [ref]$null, [ref]$errs) | Out-Null
          if ($errs) { $errs | ForEach-Object { Write-Error $_.Message }; exit 1 }
          Write-Host 'player.ps1 语法通过'